name: Validate factory

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            sfstack.lock.json
      - name: Install the verified sfstack contract distribution
        run: python tools/bootstrap_contracts.py
      - name: Exercise independent host, gates, and recovery boundaries
        run: python -m unittest discover -s tests -v
      - name: Exercise quality verification with defective and fixed candidates
        if: matrix.python-version == '3.11'
        run: python evals/run_github_regression.py --output dist/github-regression
      - name: Upload quality integration evidence
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-regression
          path: dist/github-regression
          if-no-files-found: error
          retention-days: 14
      - name: Exercise bounded software builds with unfixed and fixed candidates
        if: matrix.python-version == '3.11'
        run: python evals/run_software_regression.py --output dist/software-regression
      - name: Upload Software Factory regression evidence
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: software-regression
          path: dist/software-regression
          if-no-files-found: error
          retention-days: 14
      - name: Execute defect repair RED/GREEN and negative controls
        if: matrix.python-version == '3.11'
        run: python evals/run_defect_regression.py --output dist/defect-regression
      - name: Upload defect repair evidence
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: defect-regression
          path: dist/defect-regression
          if-no-files-found: error
          retention-days: 14

  agentic_workflows:
    name: Validate Agentic Workflows compilation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Read pinned compiler identity
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          pin = json.loads(Path('.github/aw/compiler.json').read_text())
          version = pin['version']
          digest = pin['linux_amd64_sha256']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', version):
              raise SystemExit('Expected a pinned gh-aw release')
          if not re.fullmatch(r'[0-9a-f]{64}', digest):
              raise SystemExit('Expected a SHA-256 compiler digest')
          url = f'https://github.com/github/gh-aw/releases/download/{version}/linux-amd64'
          if pin['linux_amd64_url'] != url:
              raise SystemExit('Compiler URL must identify the pinned official release')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'GH_AW_COMPILER_URL={url}\nGH_AW_COMPILER_SHA={digest}\n')
          PY
      - name: Download and verify the compiler
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            "$GH_AW_COMPILER_URL" --output "$RUNNER_TEMP/gh-aw"
          printf '%s  %s\n' "$GH_AW_COMPILER_SHA" "$RUNNER_TEMP/gh-aw" | sha256sum --check -
          chmod +x "$RUNNER_TEMP/gh-aw"
      - name: Compile the authored workflows and detect drift
        run: |
          "$RUNNER_TEMP/gh-aw" compile sfstack-review --strict --no-check-update --no-logo
          "$RUNNER_TEMP/gh-aw" compile sfstack-build --strict --no-check-update --no-logo
          git diff --exit-code -- .github/workflows/sfstack-review.lock.yml .github/workflows/sfstack-build.lock.yml .github/aw/actions-lock.json

  external_consumer:
    name: Install locked CLI in an empty external environment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Verify and install without an sfstack source checkout
        run: |
          python -m venv "$RUNNER_TEMP/contract-consumer"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/contract-consumer/bin/python" "$GITHUB_WORKSPACE/tools/bootstrap_contracts.py"
      - name: Check public JSON interface and fail-closed invocation
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/contract-consumer/bin/python" -I - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          command = str(Path(sys.executable).with_name('sfstack-contract'))
          for operation, arguments in [
              ('version', []),
              ('resolve', ['--skill', 'sf-review-change']),
              ('recipe', ['--name', 'quality']),
              ('schema', ['--name', 'artifact']),
          ]:
              observed = subprocess.run([command, operation, *arguments], capture_output=True, text=True, check=True)
              record = json.loads(observed.stdout)
              assert record['interface_version'] == '1.1'
              assert record['distribution_version'] == '1.1.0'
              assert record['operation'] == operation and record['status'] == 'passed'
              assert record['errors'] == []
          blocked = subprocess.run([command, 'gate', '--request', 'missing.json', '--policy', 'missing.json'], capture_output=True, text=True)
          assert blocked.returncode == 64
          assert json.loads(blocked.stdout)['status'] == 'invalid'
          print('Installed public interface passed; missing gate inputs failed closed.')
          PY
