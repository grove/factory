name: Compile reusable review for cross-repository prompt probe (no AI)

on:
  push:
    branches: [fix/inline-review-prompt-20261121]

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Read pinned compiler identity
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          pin = json.loads(Path('.github/aw/compiler.json').read_text())
          assert pin['version'] == 'v1.2.2'
          assert pin['linux_amd64_url'] == 'https://github.com/github/gh-aw/releases/download/v1.2.2/linux-amd64'
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"COMPILER_URL={pin['linux_amd64_url']}\nCOMPILER_SHA={pin['linux_amd64_sha256']}\n")
          PY
      - name: Download and hash verify compiler
        run: |
          curl --fail --silent --show-error --location --retry 3 "$COMPILER_URL" -o "$RUNNER_TEMP/gh-aw"
          printf '%s  %s\n' "$COMPILER_SHA" "$RUNNER_TEMP/gh-aw" | sha256sum --check -
          chmod +x "$RUNNER_TEMP/gh-aw"
      - name: Compile self-contained reviewer without running an agent
        run: |
          "$RUNNER_TEMP/gh-aw" compile sfstack-review --strict --no-check-update --no-logo
          python - <<'PY'
          import json
          from pathlib import Path
          y=Path('.github/workflows/sfstack-review.lock.yml').read_text()
          report = {
              'contains_author_file': '"author_file"' in y,
              'contains_source_body_text': 'Perform the bounded' in y,
              'contains_inline_prompt': 'GH_AW_PROMPT_CONTENT_' in y,
              'size': len(y),
              'differs_from_checked_in': True,
          }
          Path('compiled-report.json').write_text(json.dumps(report, indent=2)+'\n')
          print(json.dumps(report, indent=2))
          PY
      - name: Verify the inlined prompt and callee checkout
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/sfstack-review.md').read_text()
          lock = Path('.github/workflows/sfstack-review.lock.yml').read_text()
          assert 'inlined-imports: true' in source
          assert '"author_file"' not in lock
          assert 'GH_AW_PROMPT_CONTENT_0004' in lock
          assert 'Perform the bounded' in lock
          for part in [
              'repository: $' + '{{ job.workflow_repository }}',
              'ref: $' + '{{ job.workflow_sha }}',
              'ref: $' + '{{ inputs.head-sha }}',
          ]:
              assert part in lock, part
          assert 'ref: $' + '{{ github.workflow_sha }}' not in lock
          print('Self-contained prompt and callee-bound agent controller verified.')
          PY
      - name: Commit only generated lock files to the isolated fix branch
        env:
          EXPECTED_REPO: grove/factory
          EXPECTED_REF: refs/heads/fix/inline-review-prompt-20261121
        run: |
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPO"
          test "$GITHUB_REF" = "$EXPECTED_REF"
          git diff --check -- .github/workflows/sfstack-review.lock.yml .github/aw/actions-lock.json
          git add -- .github/workflows/sfstack-review.lock.yml .github/aw/actions-lock.json
          if git diff --cached --quiet; then
            echo 'Compiler output already matches the branch.'
          else
            for file in $(git diff --cached --name-only); do
              case "$file" in
                .github/workflows/sfstack-review.lock.yml|.github/aw/actions-lock.json) ;;
                *) echo "Unexpected staged path" >&2; exit 1 ;;
              esac
            done
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build(review): regenerate exact self-contained gh-aw lock'
            git push origin HEAD:refs/heads/fix/inline-review-prompt-20261121
          fi
      - name: Upload compiled review lock for independent inspection
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: review-compile-probe
          path: |
            .github/workflows/sfstack-review.lock.yml
            .github/aw/actions-lock.json
            compiled-report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2
