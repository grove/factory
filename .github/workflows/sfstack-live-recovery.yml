name: sfstack live GitHub reply-loss recovery (no AI)

# Only an explicit human dispatch on Factory/main can start this drill.
on:
  workflow_dispatch:
    inputs:
      issue-number:
        description: Dedicated no-AI probe issue (must be 9)
        required: true
        type: number
        default: 9

run-name: "no-AI live recovery / issue #${{ inputs.issue-number }}"
permissions: {}

concurrency:
  group: sfstack-live-recovery-${{ github.repository }}-${{ inputs.issue-number }}
  queue: max

jobs:
  verify:
    name: Independently verify a synthetic one-file canary (no model)
    if: >-
      github.repository == 'grove/factory' &&
      github.actor == 'grove' &&
      github.ref == 'refs/heads/main' &&
      inputs.issue-number == 9
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install pinned contract CLI
        run: python candidate/tools/bootstrap_contracts.py
      - name: Prepare synthetic non-agent fixture and run actual independent host checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python candidate/evals/live_recovery_probe.py --phase prepare
          --issue-number 9 --repo candidate --inputs inputs
          --context-dir context --result result --report fixture-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: recovery-fixture-${{ github.run_attempt }}
          path: |
            inputs/
            fixture-report.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sfstack-software-result-${{ github.run_attempt }}
          path: result/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Real GitHub writes with deliberately lost post-ACK replies
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: sfstack-quality-publication-${{ github.repository }}
      queue: max
    permissions:
      contents: write
      issues: read
      pull-requests: write
      actions: write
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install pinned contract CLI
        run: python candidate/tools/bootstrap_contracts.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: recovery-fixture-${{ github.run_attempt }}
          path: .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sfstack-software-result-${{ github.run_attempt }}
          path: result
      - name: Actual migrated publisher with injected real GitHub reply loss
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python candidate/evals/live_recovery_probe.py --phase publish
          --issue-number 9 --repo candidate --inputs inputs
          --result result --report live-recovery-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: live-recovery-proof-${{ github.run_attempt }}
          path: live-recovery-report.json
          if-no-files-found: warn
          retention-days: 14
