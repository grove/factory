name: Verify reusable Software compiler and stage generated lock (no AI)

on:
  push:
    branches: [feat/reusable-software-factory-20261122]

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Read pinned compiler identity
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          pin=json.loads(Path('.github/aw/compiler.json').read_text())
          assert pin['version'] == 'v1.2.2'
          assert pin['linux_amd64_url'] == 'https://github.com/github/gh-aw/releases/download/v1.2.2/linux-amd64'
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f"COMPILER_URL={pin['linux_amd64_url']}\nCOMPILER_SHA={pin['linux_amd64_sha256']}\n")
          PY
      - name: Download SHA-256-verified compiler
        run: |
          curl --fail --silent --show-error --location --retry 3 "$COMPILER_URL" -o "$RUNNER_TEMP/gh-aw"
          printf '%s  %s\n' "$COMPILER_SHA" "$RUNNER_TEMP/gh-aw" | sha256sum --check -
          chmod +x "$RUNNER_TEMP/gh-aw"
      - name: Compile and verify self-contained Software builder
        run: |
          "$RUNNER_TEMP/gh-aw" compile sfstack-build --strict --no-check-update --no-logo
          python - <<'PY'
          import json
          from pathlib import Path
          authored=Path('.github/workflows/sfstack-build.md').read_text()
          compiled=Path('.github/workflows/sfstack-build.lock.yml').read_text()
          assert 'inlined-imports: true' in authored
          assert '"author_file"' not in compiled
          assert 'GH_AW_PROMPT_CONTENT_0004' in compiled
          assert 'Perform the bounded' in compiled
          assert 'repository: $' + '{{ job.workflow_repository }}' in compiled
          assert 'ref: $' + '{{ job.workflow_sha }}' in compiled
          assert 'ref: $' + '{{ github.workflow_sha }}' not in compiled
          print('Self-contained Software builder is compiled from pinned Factory source.')
          Path('compile-software-report.json').write_text(json.dumps({
              'self_contained': True, 'callee_bound': True,
              'compiled_bytes': len(compiled)
          }, indent=2)+'\n')
          PY
      - name: Store generated lock outside protected workflow path for promotion
        env:
          EXPECTED_REPO: grove/factory
          EXPECTED_BRANCH: refs/heads/feat/reusable-software-factory-20261122
        run: |
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPO"
          test "$GITHUB_REF" = "$EXPECTED_BRANCH"
          mkdir -p .factory-compile-output
          cp .github/workflows/sfstack-build.lock.yml .factory-compile-output/sfstack-build.lock.yml
          cp .github/aw/actions-lock.json .factory-compile-output/actions-lock.json
          git add -- .factory-compile-output/sfstack-build.lock.yml .factory-compile-output/actions-lock.json
          if git diff --cached --quiet; then
            echo 'Pinned compiler output already staged.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'test(software): stage pinned compiler output for exact promotion'
            git push origin HEAD:refs/heads/feat/reusable-software-factory-20261122
          fi
      - name: Retain no-AI compiler evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reusable-software-compile-probe
          path: |
            .factory-compile-output/sfstack-build.lock.yml
            compile-software-report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2
