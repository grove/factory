name: sfstack recovery no-AI probe

# An intentionally inert Actions dispatch, NOT a Quality assessment.
on:
  workflow_dispatch:
    inputs:
      pr-number:
        required: true
        type: string
      expected-head:
        required: true
        type: string
      expected-base:
        required: true
        type: string
      request-id:
        required: true
        type: string

run-name: "sfstack quality / PR #${{ inputs.pr-number }} / request ${{ inputs.request-id }}"
permissions: {}

jobs:
  no_ai:
    name: Inert run identity probe (no token or Copilot)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wait long enough to observe authenticated in-flight state
        run: |
          echo "No Copilot. No passing Quality check will be published."
          sleep 60
          echo "No-AI Actions dispatch completed."
